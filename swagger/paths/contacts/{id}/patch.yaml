tags:
  - Contacts
summary: Patch contact by id
operationId: patchContact
description: "Patch contact by id"
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: "65ca67e7ae7f10c88b598300"
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: "John Doe"
          phoneNumber:
            description: "Contact's phoneNumber"
            type: string
            example: "+380123456789"
          contactType:
            description: "Contact's type"
            type: string
            enum: ["work", "home", "personal"]
          isFavourite:
            description: "Whether is contact favourite"
            type: boolean
            example: false
          email:
            description: "Contact's email"
            type: string
            example: bsrh@example.com
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  "200":
    description: "Successfully patched a contact!"
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: "../../../components/schemas/contact.yaml"
  "401":
    $ref: "../../../components/responses/401.yaml"
  "404":
    $ref: "../../../components/responses/404.yaml"
